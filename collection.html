<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Royal Essenza Catalog - Browse our premium bespoke fragrances, pure attars, essential oils, and gift sets.">
  <title>Perfume Collections | Royal Essenza Catalog</title>
  
  <!-- Core styling link -->
  <link rel="stylesheet" href="style.css">
</head>
<body class="collection-page-body">

  <!-- Sub-page Navigation Header -->
  <header>
    <div class="container nav-container">
      <!-- Left side: Back to Home Arrow -->
      <div class="nav-back-wrapper">
        <a href="index.html" class="nav-back-btn" aria-label="Back to Home">
          <svg style="width: 28px; height: 28px; fill: #111111;" viewBox="0 0 24 24">
            <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
          </svg>
        </a>
      </div>
      
      <!-- Centered Logo Image Only -->
      <a href="index.html" class="logo logo-center" aria-label="Royal Essenza Home">
        <img src="assets/logo.png" alt="Royal Essenza" class="brand-logo-img">
      </a>
      
      <!-- Right side: Sub-page Desktop Navigation -->
      <nav class="nav-desktop">
        <a href="index.html" class="nav-link">Home</a>
        <a href="#" class="nav-link active" style="color: var(--accent-gold);">Collections</a>
        <a href="track-order.html" class="nav-link">Track Order</a>
        <a href="index.html#contact" class="nav-link">Contact</a>
      </nav>
      
      <!-- Mobile Menu Button (Hamburger) -->
      <button class="mobile-menu-btn" id="btn-menu-open" aria-label="Open Menu">
        <svg style="width: 24px; height: 24px; fill: currentColor;" viewBox="0 0 24 24">
          <path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- Collection Layout Section -->
  <main class="collection-main-section">
    <div class="container collection-layout-container">
      
      <!-- Left Sidebar: Filter Widgets -->
      <aside class="collection-sidebar animate-fade-in">
        <!-- Widget 1: Price Filter -->
        <div class="sidebar-widget">
          <h3 class="widget-title">Filter By Price</h3>
          
          <div class="price-range-slider">
            <input type="range" id="price-range-slider-input" min="0" max="40000" value="40000" step="500" class="price-slider-input" aria-label="Price range filter">
            <div class="price-range-display-row">
              <span class="price-range-text">Price: <strong class="highlight">Rs.0 — Rs.<span id="price-slider-value">40,000</span></strong></span>
              <button class="btn-sidebar-action" id="btn-price-filter">Filter</button>
            </div>
          </div>
        </div>

        <!-- Widget 2: Product Status -->
        <div class="sidebar-widget">
          <h3 class="widget-title">Product Status</h3>
          <div class="checkbox-widget-list">
            <label class="custom-checkbox-container">
              <input type="checkbox" id="chk-on-sale" class="custom-checkbox-input">
              <span class="checkbox-mark"></span>
              <span class="checkbox-label-text">On sale</span>
            </label>
            <label class="custom-checkbox-container">
              <input type="checkbox" id="chk-in-stock" class="custom-checkbox-input" checked>
              <span class="checkbox-mark"></span>
              <span class="checkbox-label-text">In stock</span>
            </label>
          </div>
        </div>
      </aside>

      <!-- Right Main Panel: Top Bar & Product Grid -->
      <section class="collection-main-panel animate-fade-in" style="animation-delay: 0.2s;">
        <!-- Top Bar: Filters & Search -->
        <div class="collection-top-bar">
          
          <!-- Pill Search Input -->
          <div class="collection-search-wrapper">
            <div class="pill-search-box">
              <span class="pill-search-icon">
                <svg style="width: 18px; height: 18px; fill: #777777;" viewBox="0 0 24 24">
                  <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
                </svg>
              </span>
              <input type="text" id="catalog-search-field" class="search-field" placeholder="Search products..." aria-label="Search Catalog">
            </div>
          </div>
          
          <!-- Mobile Filters Toggle Button -->
          <button class="mobile-filters-toggle-btn" id="btn-mobile-filters-toggle">
            <svg style="width: 16px; height: 16px; fill: currentColor;" viewBox="0 0 24 24">
              <path d="M10 18h4v-2h-4v2zM3 6v2h18V6H3zm3 7h12v-2H6v2z"/>
            </svg>
            <span>Filters</span>
          </button>

          

          <!-- Sorting Dropdown -->
          <div class="filter-select-wrapper">
            <select id="select-sort" class="luxury-filter-select" aria-label="Sort products">
              <option value="popularity">Sort by popularity</option>
              <option value="price-low">Sort by price: low to high</option>
              <option value="price-high">Sort by price: high to low</option>
            </select>
          </div>

        </div>

        <!-- Products Catalog Grid -->
        <div class="collection-products-grid" id="catalog-products-grid">
          <!-- Products will be generated dynamically by collection.js to support flawless live filter states -->
          <div class="catalog-loading-state">
            <div class="luxury-spinner"></div>
            <p>Loading Collection...</p>
          </div>
        </div>
      </section>

    </div>
  </main>

  <!-- Mobile Menu Drawer Panel -->
  <div class="menu-overlay" id="menu-overlay"></div>
  <div class="mobile-menu-drawer" id="mobile-menu-drawer">
    <div class="menu-header">
      <div class="menu-logo-wrapper">
        <img src="assets/logo.png" alt="Royal Essenza" class="menu-logo-img">
      </div>
      <button class="btn-close-menu" id="btn-menu-close" aria-label="Close menu">
        <svg style="width: 24px; height: 24px; fill: currentColor;" viewBox="0 0 24 24">
          <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
        </svg>
      </button>
    </div>
    
    <div class="menu-links-wrapper">
      <a href="index.html" class="menu-link">Home</a>
      <a href="#" class="menu-link active" style="color: var(--accent-gold);">Collection</a>
      <a href="track-order.html" class="menu-link">Track Order</a>
      <a href="index.html#contact" class="menu-link">Contact</a>
    </div>
    
    <div class="menu-drawer-footer">
      <p class="menu-drawer-tagline">The Essence of Excellence.</p>
      <div class="menu-drawer-socials">
        <a href="#" class="social-circle" aria-label="Instagram">
          <svg style="width: 16px; height: 16px; fill: currentColor;" viewBox="0 0 16 16"><path d="M8 0C5.829 0 5.556.01 4.703.048 3.85.088 3.269.222 2.76.42a3.917 3.917 0 0 0-1.417.923A3.927 3.927 0 0 0 .42 2.76C.222 3.268.087 3.85.048 4.7.01 5.555 0 5.827 0 8.001c0 2.172.01 2.444.048 3.297.04.852.174 1.433.372 1.942.205.526.478.972.923 1.417.444.445.89.719 1.416.923.51.198 1.09.333 1.942.372C5.555 15.99 5.827 16 8 16s2.444-.01 3.298-.048c.851-.04 1.434-.174 1.943-.372a3.916 3.916 0 0 0 1.416-.923c.445-.445.718-.891.923-1.417.197-.509.332-1.09.372-1.942C15.99 10.445 16 10.173 16 8s-.01-2.445-.048-3.299c-.04-.851-.175-1.433-.372-1.941a3.926 3.926 0 0 0-.923-1.417A3.911 3.911 0 0 0 13.24.42c-.51-.198-1.092-.333-1.943-.372C10.443.01 10.172 0 7.998 0h.003zm-.717 1.442h.718c2.136 0 2.389.007 3.232.046.78.035 1.204.166 1.486.275.373.145.64.319.92.599.28.28.453.546.598.92.11.281.24.705.275 1.485.039.843.047 1.096.047 3.231s-.008 2.389-.047 3.232c-.035.78-.166 1.203-.275 1.485a2.47 2.47 0 0 1-.599.919c-.28.28-.546.453-.92.598-.28.11-.704.24-1.485.276-.843.038-1.096.047-3.232.047s-2.39-.009-3.233-.047c-.78-.036-1.203-.166-1.485-.276a2.478 2.478 0 0 1-.92-.598 2.48 2.48 0 0 1-.6-.92c-.109-.281-.24-.705-.275-1.485-.038-.843-.046-1.096-.046-3.233 0-2.136.008-2.388.046-3.231.036-.78.166-1.204.276-1.486.145-.373.319-.64.599-.92.28-.28.546-.453.92-.598.282-.11.705-.24 1.485-.276.738-.034 1.024-.044 2.515-.045v.002zm4.988 1.328a.96.96 0 1 0 0 1.92.96.96 0 0 0 0-1.92zm-4.27 1.122a4.109 4.109 0 1 0 0 8.217 4.109 4.109 0 0 0 0-8.217zm0 1.441a2.667 2.667 0 1 1 0 5.334 2.667 2.667 0 0 1 0-5.334z"/></svg>
        </a>
        <a href="#" class="social-circle" aria-label="TikTok">
          <svg style="width: 16px; height: 16px; fill: currentColor;" viewBox="0 0 24 24"><path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.2 1.74 2.89 2.89 0 0 1 2.31-4.64 2.93 2.93 0 0 1 .88.13V9.4a6.84 6.84 0 0 0-1 .05A6.33 6.33 0 0 0 5 20.1a6.34 6.34 0 0 0 10.86-4.43v-7a8.16 8.16 0 0 0 4.77 1.52v-3.4a4.85 4.85 0 0 1-1.04-.1z"/></svg>
        </a>
      </div>
    </div>
  </div>

  <!-- Cart Drawer Panel -->
  <div class="cart-overlay" id="cart-overlay"></div>
  <div class="cart-drawer" id="cart-drawer">
    <div class="cart-header">
      <h3 class="cart-title">
        <svg style="width: 24px; height: 24px; fill: var(--accent-gold);" viewBox="0 0 24 24">
          <path d="M19 6h-2c0-2.76-2.24-5-5-5S7 3.24 7 6H5c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-7-3c1.66 0 3 1.34 3 3H9c0-1.66 1.34-3 3-3zm7 17H5V8h2v2c0 .55.45 1 1 1s1-.45 1-1V8h6v2c0 .55.45 1 1 1s1-.45 1-1V8h2v12z"/>
        </svg>
        <span>Shopping Bag</span>
      </h3>
      <button class="btn-close-cart" id="btn-cart-close" aria-label="Close cart">
        <svg style="width: 24px; height: 24px; fill: currentColor;" viewBox="0 0 24 24">
          <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
        </svg>
      </button>
    </div>

    <!-- Scrollable Items Wrapper -->
    <div class="cart-items-wrapper">
      <div class="empty-cart-message">
        <svg style="width: 48px; height: 48px; fill: var(--accent-gold); margin-bottom: 1rem;" viewBox="0 0 24 24">
          <path d="M17.21 9l-4.3-6.18c-.39-.55-1.07-.86-1.74-.86s-1.35.31-1.74.86L5.13 9H1.5v2h21V9h-5.29zm-5.04-4.86c.07-.1.21-.14.33-.14.13 0 .26.04.33.14L15.63 9H8.71l3.46-4.86zM1.5 21c0 1.1.9 2 2 2h17c1.1 0 2-.9 2-2V13H1.5v8z"/>
        </svg>
        <p>Aapka shopping bag khali hai.</p>
      </div>
    </div>

    <!-- Bottom Footer (Total, checkout) -->
    <div class="cart-footer">
      <div class="cart-total-row">
        <span>Subtotal</span>
        <span class="cart-total-price">$0.00</span>
      </div>
      <button class="btn-checkout">Checkout</button>
    </div>
  </div>


  <!-- Premium Simple Footer Copyright Bar -->
  <footer class="simple-footer">
    <div class="container text-center">
      <p class="copyright">&copy; 2026 ROYAL ESSENZA. All Rights Reserved.</p>
    </div>
  </footer>

  <!-- Floating Luxury Cart Button -->
  <button class="floating-cart-btn" id="btn-cart-open" aria-label="Shopping Bag">
    <svg style="width: 20px; height: 20px; fill: #FFFFFF;" viewBox="0 0 16 16">
      <path d="M0 1.5A.5.5 0 0 1 .5 1H2a.5.5 0 0 1 .485.379L2.89 3H14.5a.5.5 0 0 1 .491.592l-1.5 8A.5.5 0 0 1 13 12H4a.5.5 0 0 1-.491-.408L2.01 3.607 1.61 2H.5a.5.5 0 0 1-.5-.5zM3.102 4l1.313 7h8.17l1.313-7H3.102zM5 12a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm7 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm-7 1a1 1 0 1 1 0 2 1 1 0 0 1 0-2zm7 0a1 1 0 1 1 0 2 1 1 0 0 1 0-2z"/>
    </svg>
    <span class="cart-count">0</span>
  </button>

  <!-- Floating WhatsApp Button -->
  <a href="https://wa.me/971480076925" class="floating-whatsapp-btn" target="_blank" rel="noopener noreferrer" aria-label="Chat on WhatsApp">
    <svg style="width: 22px; height: 22px; fill: #FFFFFF;" viewBox="0 0 16 16">
      <path d="M13.601 2.326A7.854 7.854 0 0 0 7.994 0C3.627 0 .068 3.558.064 7.926c0 1.399.366 2.76 1.057 3.965L0 16l4.204-1.102a7.933 7.933 0 0 0 3.79 1.043h.003c4.368 0 7.927-3.558 7.929-7.93a7.882 7.882 0 0 0-2.33-5.69M7.994 14.521a6.573 6.573 0 0 1-3.356-.92l-.24-.144-2.494.654.666-2.433-.156-.251a6.56 6.56 0 0 1-1.007-3.505c0-3.626 2.957-6.584 6.591-6.584a6.56 6.56 0 0 1 4.66 1.931 6.557 6.557 0 0 1 1.928 4.66c-.004 3.639-2.961 6.592-6.592 6.592zm3.69-4.82c-.202-.101-1.196-.59-1.38-.658-.182-.067-.315-.1-.448.1-.134.2-.516.642-.634.778-.118.137-.236.154-.438.053a5.483 5.483 0 0 1-1.624-1.002 5.922 5.922 0 0 1-1.123-1.396c-.118-.202-.012-.311.089-.412.09-.09.202-.236.302-.354.101-.118.134-.2.202-.334.067-.136.034-.254-.017-.355-.05-.101-.448-1.08-.614-1.48-.162-.389-.34-.336-.468-.343a5.99 5.99 0 0 0-.34-.007c-.134 0-.352.05-.536.25-.184.2-.702.686-.702 1.675 0 .99.72 1.948.82 2.082.1.134 1.417 2.167 3.435 3.037.48.207.854.33 1.147.424.483.153.923.131 1.272.079.39-.058 1.197-.49 1.362-.962.166-.473.166-.88.117-.965-.05-.084-.183-.133-.385-.234z"/>
    </svg>
  </a>

  <!-- Link script file -->
  <script src="collection.js"></script>
</body>
</html>
